<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Page 2 - ALERT 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body { height:100%; width:100%; margin:0; padding:0; }
        body { background:#000; display:flex; align-items:center; justify-content:center; }
        .fullscreen-image { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; filter: brightness(0.78) contrast(1.08) saturate(1.05); }
        /* subtle global overlay to improve contrast for overlaid text */
        body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.22); z-index: 200; pointer-events: none; }
        /* Quote overlay */
        .quote-overlay {
            position: fixed;
            left: 50%;
            top: 62%;
            transform: translate(-50%, -50%);
            z-index: 320;
            pointer-events: none;
            text-align: center;
            width: 92%;
            max-width: 1200px;
        }

        .quote {
            font-family: 'Cinzel', 'Poppins', serif;
            font-weight: 700;
            font-size: clamp(28px, 4.6vw, 64px);
            line-height: 1.05;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
            padding: 12px 18px;
            background: linear-gradient(90deg, rgba(255,255,255,0.98) 0%, rgba(242,242,242,0.95) 50%, rgba(230,230,230,0.95) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.45);
            -webkit-text-stroke: 0.6px rgba(0,0,0,0.08);
            opacity: 0.98;
        }

        /* subtle shimmer effect across the text */
        .quote::before {
            content: '';
            position: absolute;
            inset: 0;
            left: -30%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            filter: blur(10px);
            opacity: 0.25;
            animation: shimmer 6s linear infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { left: -40%; }
            50% { left: 120%; }
            100% { left: 120%; }
        }
        /* Overlay controls (Back / Home) */
        .overlay-controls { position:fixed; top:18px; left:18px; display:flex; gap:10px; z-index:300; }
        .overlay-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px; border:none; cursor:pointer; font-weight:700; color:#fff; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px); box-shadow:0 6px 18px rgba(0,0,0,0.35); }
        .overlay-btn:hover { transform:translateY(-2px); background:rgba(255,255,255,0.08); }
        .overlay-btn:active { transform:translateY(0); }
    </style>
</head>
</head>
<body>
    <div class="overlay-controls">
        <button class="overlay-btn" onclick="history.back()">← Back</button>
        <button class="overlay-btn" onclick="window.location.href='index.html'">🏠 Home</button>
    </div>

    <!-- Quote overlay -->
    <div class="quote-overlay" aria-hidden="true">
        <div class="quote">WHEN SECONDS MATTER  ALERT SAVES LIFE</div>
    </div>

    <img class="fullscreen-image" src="./imagelast/create%20image%20showing%20people%20overcome%20natural%20disaster.jpg" alt="People overcoming a natural disaster">
</body>
</html>
